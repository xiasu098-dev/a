<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Guess the Number Game!</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="game">

    <section class="show_area">
      <h3>猜数字游戏</h3>
      <div id="feedback">请在下方选择在1-40之间的数字</div>

      <div class="row">
        <div id="guess"></div>
        <button id="check">确认</button>
      </div>

      <div class="row">
        <button id="new-game">重新开始</button>
        <div class="attempts">剩余次数: <span id="attempt-count">5</span></div>
      </div>
    </section>

    <section class="numbers_area">
      <div id="buttons"></div>
    </section>

    <section class="history_area">
      <h4>历史记录</h4>
      <ul id="history-list"></ul>
    </section>

  </main>
  <script src="script.js"></script>
</body>

</html>
